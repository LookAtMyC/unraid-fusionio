name: Build drivers

on:
  schedule:
    - cron: "17 4 * * *"   # daily: pick up new Unraid releases
  workflow_dispatch:
    inputs:
      versions:
        description: "Unraid versions to (re)build, space separated (empty = all missing)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.inputs.versions }}
        run: |
          export EXISTING="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 500 --json tagName --jq '.[].tagName')"
          matrix="$(python3 .github/scripts/plan.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$matrix" | jq '.include | length')" -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.kernel }} (Unraid ${{ matrix.unraid }})
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        env:
          UNRAID: ${{ matrix.unraid }}
          KERNEL: ${{ matrix.kernel }}
        run: |
          [[ "$UNRAID" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]] || { echo "bad version: $UNRAID"; exit 1; }
          [[ "$KERNEL" =~ ^[0-9]+\.[0-9]+\.[0-9]+-Unraid$ ]] || { echo "bad kernel: $KERNEL"; exit 1; }
          bash build/build.sh "$UNRAID" out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          UNRAID: ${{ matrix.unraid }}
          KERNEL: ${{ matrix.kernel }}
        run: |
          tag="$KERNEL"
          notes="Fusion-io iomemory-vsl driver for kernel ${tag} (Unraid ${UNRAID}).

          $(cat out/*.txt)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" out/* --title "Driver for $tag (Unraid ${UNRAID})" --notes "$notes"
          fi
